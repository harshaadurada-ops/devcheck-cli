[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devcheck-cli"
version = "1.0.0"
description = "A deterministic command-line developer environment diagnostics tool"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "DevCheck CLI Contributors" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.0", "build>=1.0"]

[project.scripts]
devcheck = "devcheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
